[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tg-site-login"
version = "0.1.0"
description = "Website login through a Telegram bot with phone confirmation, plus order and lead notifications to a manager chat."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Artem Svinoboev" }]
keywords = ["telegram", "aiogram", "fastapi", "login", "notifications"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2.32",
    "ruff>=0.16",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tg_site_login"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "S", "C4", "N", "PL", "TID"]
ignore = [
    "PLR0911",  # state machines legitimately return early
    "PLR0912",
    "PLR0913",  # many arguments are fine for explicit dependency injection
    "PLR2004",  # magic values in comparisons
    "S311",     # random is used for backoff jitter, not for secrets
    "RUF001",   # Cyrillic user-facing strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
